name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "review/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install from package metadata
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Full suite
        run: python -m unittest discover -s tests -t . -v
      - name: Suite under hostile interpreter settings
        env:
          PYTHONHASHSEED: random
          LC_ALL: C
          PYTHONUTF8: "0"
          TZ: Pacific/Chatham
        run: python -m unittest discover -s tests -t .

  gates:
    name: vocabulary, legacy, and secret gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Committed gates
        run: python -m unittest tests.test_release -v

  package:
    name: build, inspect, and install from built artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -l dist/
      - name: Install the project so the inspection tests can import it
        # The inspection tests read the built archives, but they live in the test suite and
        # import the project and PyYAML like any other test. Building alone does not put those
        # on the job's interpreter.
        run: python -m pip install -e .
      - name: Inspect package contents
        run: python -m unittest tests.test_release.PackageContents -v
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
      - name: Clean-workspace quickstart from the installed wheel
        run: |
          mkdir -p /tmp/demo && cd /tmp/demo
          /tmp/wheel-env/bin/vfy --version
          /tmp/wheel-env/bin/vfy --help
          /tmp/wheel-env/bin/vfy init --template pipeline-gate
          mkdir -p bin ci
          printf '#!/bin/sh\nexit 0\n' > bin/deploy.sh && chmod +x bin/deploy.sh
          printf '#!/bin/sh\nprintf %s "\\"passed\\""\n' '' > ci/last-test-result.sh
          chmod +x ci/last-test-result.sh
          /tmp/wheel-env/bin/vfy run --identity branch=main -- bin/deploy.sh v1
          /tmp/wheel-env/bin/vfy receipts list
          /tmp/wheel-env/bin/vfy replay "$(ls .vfy/receipts/*.json | head -1)"
      - name: The installed package must not need the source tree
        run: |
          cd /tmp/demo
          /tmp/wheel-env/bin/python -c "
          import vfy.resources as r, pathlib
          here = pathlib.Path(r.__file__).resolve().parent
          assert r.schema_dir().is_relative_to(here), r.schema_dir()
          assert r.template_dir().is_relative_to(here), r.template_dir()
          print('runtime resources resolve inside the installed package')"
      - name: Install the source distribution into another clean environment
        run: |
          python -m venv /tmp/sdist-env
          /tmp/sdist-env/bin/pip install dist/*.tar.gz
          cd /tmp && /tmp/sdist-env/bin/vfy --version

  sdist-self-audit:
    name: the sdist must verify itself, from outside the checkout
    # A green source checkout says nothing about the artifact. The sdist shipped `tests/` without
    # the `conformance/` kit those tests run, the `tools/` that drive it, or the `.gitignore` the
    # secret gate reads — so 37 of its own tests were red for anyone who ran them from the
    # artifact rather than from a git clone, and no job noticed because every job had a clone.
    # This one unpacks the artifact somewhere else and runs the suite the artifact itself ships.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build the source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
      - name: Unpack it outside the checkout
        run: |
          mkdir -p /tmp/artifact
          tar xzf dist/*.tar.gz -C /tmp/artifact
          ls /tmp/artifact
      - name: Install only the artifact, into a clean environment
        run: |
          python -m venv /tmp/audit-env
          /tmp/audit-env/bin/pip install /tmp/artifact/verify_run-*/
      - name: Run the suite the artifact ships, from the artifact
        # No PYTHONPATH and a working directory outside the checkout: an accidental import of the
        # repository package would make this job prove the wrong thing.
        run: |
          cd /tmp/artifact/verify_run-*/
          env -u PYTHONPATH /tmp/audit-env/bin/python -m unittest discover -s tests -t . -v \
            2>&1 | tail -40
      - name: The artifact must not have imported the checkout
        # Deliberately not asserting that `vfy` resolves inside site-packages. Running a shipped
        # suite from the unpacked tree puts that tree's own `vfy/` first, and those are the
        # artifact's bytes either way — that is what a downstream auditor actually does. The
        # property worth proving is the one that would make this job a lie: that nothing was
        # imported from the *original checkout*.
        run: |
          cd /tmp/artifact/verify_run-*/
          env -u PYTHONPATH /tmp/audit-env/bin/python -c "
          import vfy, pathlib
          where = pathlib.Path(vfy.__file__).resolve()
          checkout = pathlib.Path('$GITHUB_WORKSPACE').resolve()
          assert not where.is_relative_to(checkout), 'imported from the checkout: %s' % where
          assert str(where).startswith('/tmp/'), where
          print('vfy imported from the artifact, not the checkout:', where)"

  conformance:
    name: Decision Replay Conformance Profile v1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the distribution and install it into a clean environment
        # The implementation under test is a built distribution installed on its own, not this
        # checkout: an adapter that reached a source tree would be measuring something no one
        # can download.
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m venv /tmp/conformance-env
          /tmp/conformance-env/bin/pip install --quiet dist/*.whl
          /tmp/conformance-env/bin/vfy --version
      - name: Run the full conformance suite
        # Exit 0 PASS, 1 FAIL, 2 INCOMPLETE, 3 runner error. Anything but 0 fails this job:
        # INCOMPLETE means the run could not be conducted, which is not a pass either.
        run: |
          /tmp/conformance-env/bin/python tools/run_conformance.py \
            --profile conformance/decision-replay-v1/profile.json \
            --adapter-arg /tmp/conformance-env/bin/python \
            --adapter-arg "$PWD/tools/conformance_adapter.py" \
            --adapter-arg=--vfy \
            --adapter-arg /tmp/conformance-env/bin/vfy \
            --out /tmp/conformance-result.json
      - name: The result must be PASS, and every kit digest must still match
        run: python tools/check_conformance_result.py /tmp/conformance-result.json
      - name: The kit's own tests
        run: |
          python -m pip install -e .
          python -m unittest tests.test_conformance -v
      - name: Print the result document
        if: always()
        # Printed rather than uploaded as an artifact. `actions/upload-artifact` returns 403 under
        # this workflow's `permissions: contents: read`, and the fix would be to widen the job's
        # token — which also grants cancelling runs and deleting artifacts, for the convenience of
        # a downloadable copy. The verdict is already enforced above by
        # `check_conformance_result.py`, and the log is a permanent record of the same bytes.
        run: cat /tmp/conformance-result.json
